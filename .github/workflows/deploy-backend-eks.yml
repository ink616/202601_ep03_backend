name: CI/CD Backend Node - Quality, Test, Security, ECR, Deploy EKS

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPO_BACKEND: tienda-backend
  K8S_NAMESPACE: tienda
  DEPLOYMENT_NAME: tienda-backend
  NODE_VERSION: '20'

permissions:
  contents: write

jobs:
  # ============================================================
  # JOB 1: CODE QUALITY
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Lint
        run: npm run lint --if-present

  # ============================================================
  # JOB 2: BUILD & TEST
  # ============================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npm test --if-present

  # ============================================================
  # JOB 3: SECURITY - Snyk
  # ============================================================
  security:
    name: Snyk Security
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Validar secret de Snyk
        run: |
          set -euo pipefail
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "ERROR: Falta SNYK_TOKEN en GitHub Secrets"
            exit 1
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Instalar Snyk CLI
        run: npm install -g snyk@latest

      - name: Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --file=package.json || true

  # ============================================================
  # JOB 4: VERSIONING - calcula v1.x.0 y crea tag git
  # ============================================================
  versioning:
    name: Semantic Version (v1.x.0)
    runs-on: ubuntu-latest
    needs: security
    outputs:
      new_tag: ${{ steps.calc.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular y crear tag
        id: calc
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v1.*' --sort=-v:refname | head -1)
          if [ -z "$LAST" ]; then
            NEW="v1.0.0"
          else
            MINOR=$(echo "$LAST" | cut -d. -f2)
            NEW="v1.$((MINOR + 1)).0"
          fi
          echo "Ultimo: ${LAST:-ninguno} -> Nuevo: $NEW"
          echo "new_tag=$NEW" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW"
          git push origin "$NEW"

  # ============================================================
  # JOB 5: BUILD & PUSH ECR
  # ============================================================
  build-push-ecr:
    name: Build & Push ECR (${{ needs.versioning.outputs.new_tag }})
    runs-on: ubuntu-latest
    needs: versioning
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push con cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_BACKEND }}:${{ needs.versioning.outputs.new_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen build
        run: |
          echo "### Imagen publicada en ECR" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${{ needs.versioning.outputs.new_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registry:** \`${{ steps.login-ecr.outputs.registry }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repositorio:** \`${{ env.ECR_REPO_BACKEND }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # JOB 6: DEPLOY A EKS
  # ============================================================
  deploy:
    name: Deploy a EKS
    runs-on: ubuntu-latest
    needs: [versioning, build-push-ecr]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr-deploy
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configurar nombre del cluster EKS
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.EKS_CLUSTER_NAME }}" ]; then
            echo "ERROR: Falta EKS_CLUSTER_NAME en GitHub Secrets"
            exit 1
          fi
          echo "EKS_CLUSTER_NAME=${{ secrets.EKS_CLUSTER_NAME }}" >> "$GITHUB_ENV"

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configurar kubeconfig
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Aplicar manifiestos k8s
        run: |
          set -euo pipefail
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

      - name: Actualizar imagen del deployment
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-deploy.outputs.registry }}
          IMAGE_TAG: ${{ needs.versioning.outputs.new_tag }}
        run: |
          set -euo pipefail
          kubectl set image "deployment/${DEPLOYMENT_NAME}" \
            "backend=$ECR_REGISTRY/${ECR_REPO_BACKEND}:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"

      - name: Esperar rollout backend
        run: |
          set -euo pipefail
          kubectl rollout status "deployment/${DEPLOYMENT_NAME}" -n "$K8S_NAMESPACE" --timeout=600s

      - name: Verificar estado final
        run: |
          set -euo pipefail
          kubectl get pods -n "$K8S_NAMESPACE" -l "app=${DEPLOYMENT_NAME}" -o wide
          kubectl get svc  -n "$K8S_NAMESPACE" -l "app=${DEPLOYMENT_NAME}"
          kubectl get hpa  tienda-backend-hpa -n "$K8S_NAMESPACE" 2>/dev/null || true